name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115,<1" \
            "uvicorn>=0.30,<1" \
            "pydantic>=2.9,<3" \
            "python-dotenv>=1,<2" \
            "python-multipart>=0.0.12,<1" \
            "httpx>=0.27,<1" \
            "pymilvus[model]>=2.5,<4" \
            "minio>=7.2,<8" \
            "neo4j>=5.20,<7" \
            "pymongo>=4.8,<5" \
            "langgraph>=1.0,<2" \
            "langchain-core>=1.0,<2" \
            "langchain-openai>=1.0,<2"

      - name: Compile project sources
        run: python -m compileall -q -x "\.venv|import_temp_Dir|__pycache__" knowledge tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic contract gate
        run: python scripts/run_evaluation.py --provider contract --output evaluation/results/ci.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-python-${{ matrix.python-version }}
          path: |
            evaluation/results/ci.json
            evaluation/results/ci.md
          if-no-files-found: warn
