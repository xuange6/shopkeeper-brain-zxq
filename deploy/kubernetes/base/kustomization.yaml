apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - service.yaml
  - api.yaml
  - worker.yaml
  - scheduler.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: shopkeeper-brain
    includeSelectors: true
images:
  - name: shopkeeper-brain
    newName: registry.example.com/knowledge/shopkeeper-brain
    newTag: stage3
