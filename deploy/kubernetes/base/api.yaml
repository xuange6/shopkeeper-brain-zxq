apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkeeper-api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkeeper-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopkeeper-api
    spec:
      serviceAccountName: shopkeeper-brain
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shopkeeper-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shopkeeper-api
      initContainers:
        - name: migrate-control-plane
          image: shopkeeper-brain
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "knowledge.lifecycle.runtime", "migrate"]
          env:
            - name: LIFECYCLE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopkeeper-runtime
                  key: LIFECYCLE_MIGRATION_DATABASE_URL
          envFrom:
            - configMapRef:
                name: shopkeeper-runtime
            - secretRef:
                name: shopkeeper-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: api
          image: shopkeeper-brain
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "knowledge.main"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: shopkeeper-runtime
            - secretRef:
                name: shopkeeper-runtime
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /var/lib/shopkeeper
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: runtime
          emptyDir:
            sizeLimit: 1Gi
        - name: models
          persistentVolumeClaim:
            claimName: shopkeeper-models
