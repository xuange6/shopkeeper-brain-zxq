apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopkeeper-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopkeeper-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shopkeeper-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              shopkeeper-brain-access: "true"
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopkeeper-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 6380}
        - {protocol: TCP, port: 19530}
        - {protocol: TCP, port: 7687}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 27017}
