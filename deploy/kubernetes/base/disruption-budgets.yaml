apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopkeeper-api
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkeeper-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopkeeper-lifecycle-worker
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkeeper-lifecycle-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopkeeper-lifecycle-scheduler
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: shopkeeper-lifecycle-scheduler
