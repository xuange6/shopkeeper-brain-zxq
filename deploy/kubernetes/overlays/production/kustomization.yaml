apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopkeeper-brain
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - worker-scaledobject.yaml
patches:
  - path: configmap-patch.yaml
images:
  - name: registry.example.com/knowledge/shopkeeper-brain
    newName: registry.example.com/knowledge/shopkeeper-brain
    newTag: replace-with-immutable-release-tag
